name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install uv==0.11.28
      - run: uv sync --locked --all-groups
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: >
          uv run pytest tests --cov=trading_bot --cov-branch --cov-fail-under=80
          --cov-report=json:coverage.json
      - run: uv run python scripts/check_critical_branch_coverage.py --report coverage.json

  bandit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14"
      - run: python -m pip install uv==0.11.28
      - run: uv sync --locked --all-groups
      - run: uv run bandit -c pyproject.toml -r src

  locked-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14"
      - run: python -m pip install uv==0.11.28
      - run: uv lock --check
      - run: uv sync --locked --all-groups
      - run: uv export --locked --all-groups --no-emit-project --output-file locked-requirements.txt > /dev/null
      - run: uv run pip-audit --requirement locked-requirements.txt --no-deps --disable-pip

  configuration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: |
          for script in infra/digitalocean/*.sh; do
            sh -n "$script"
          done
      - run: docker compose config --quiet
