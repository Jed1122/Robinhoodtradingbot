name: Options research

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  options-research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv==0.11.28
      - name: Sync locked research environment
        run: uv sync --project research --locked --all-groups
      - name: Verify mandatory research backends
        run: |
          uv run --project research --no-sync python - <<'PY'
          import QuantLib
          import duckdb
          from importlib.metadata import version

          actual = (QuantLib.__version__, duckdb.__version__)
          expected = ("1.43", "1.5.5")
          if actual != expected:
              raise SystemExit(f"research backend version mismatch: {actual!r}")
          if (version("databento-dbn"), version("zstandard")) != ("0.69.0", "0.25.0"):
              raise SystemExit("offline decoder version mismatch")
          PY
      - name: Run credential-free options research tests
        run: >
          PYTHONPATH=src uv run --project research --no-sync pytest
          tests/unit/research/test_options_pricing.py
          tests/unit/research/test_options_payoffs.py
          tests/unit/market_data/test_options_records.py
          tests/unit/market_data/test_options_data_codec.py
          tests/integration/market_data/test_options_parquet.py
          tests/unit/market_data/test_databento_batch.py
          tests/integration/market_data/test_databento_definitions.py
          tests/integration/market_data/test_databento_stage.py
          tests/integration/cli/test_databento_import.py
          tests/unit/market_data/test_databento_bars.py
          tests/unit/market_data/test_databento_quotes.py
          tests/unit/market_data/test_options_quote_stream.py
          tests/unit/config/test_options_native_data_config.py
          tests/integration/market_data/test_databento_bar_store.py
          tests/integration/market_data/test_databento_quote_store.py
          tests/integration/market_data/test_options_quote_stream_native.py
          tests/integration/market_data/test_databento_native_rows.py
          tests/unit/market_data/test_options_source_contracts.py
          tests/unit/market_data/test_options_source_dispatch.py
          tests/unit/market_data/test_options_source_verify.py
          tests/unit/market_data/test_options_session_inputs.py
          tests/unit/market_data/test_options_definition_inputs.py
          tests/unit/research/test_options_shortlist_v2.py
          tests/unit/research/test_options_shortlist_v2_wire.py
          tests/unit/research/test_options_acquisition.py
          tests/unit/research/test_options_acquisition_wire.py
          tests/unit/research/test_options_study_registration.py
          tests/unit/config/test_options_study_config.py
          tests/unit/simulation/test_options_historical_execution.py
          tests/unit/simulation/test_options_historical_clock.py
          tests/unit/simulation/test_options_historical_policy.py
          tests/unit/simulation/test_options_historical_restart.py
          tests/unit/simulation/test_options_historical_restart_adversarial.py
          tests/unit/research/test_options_account_journal.py
          tests/integration/simulation/test_options_historical_order_steps.py
          tests/integration/simulation/test_options_historical_episode.py
          tests/integration/cli/test_options_native.py
          tests/integration/research/test_native_options_pipeline.py
